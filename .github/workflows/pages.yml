name: Pages

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gh-pages-writes
  cancel-in-progress: false

jobs:
  publish_preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Collect reviewable PR numbers
        id: reviewable_prs
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            return JSON.stringify(
              pulls
                .filter(pull => pull.state === "open" && pull.draft === false && pull.head?.repo?.full_name === repository)
                .map(pull => pull.number)
                .sort((a, b) => a - b)
            );

      - name: Reconcile previews on gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_PUBLISH_MARKER: .pages-root-from-main
          REVIEWABLE_PRS: ${{ steps.reviewable_prs.outputs.result }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PAGES_DIR="$RUNNER_TEMP/gh-pages"
          STAGING_DIR="$RUNNER_TEMP/preview-sources"
          export PAGES_DIR REVIEWABLE_PRS STAGING_DIR
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "$PAGES_DIR"
          cd "$PAGES_DIR"

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

          if [ ! -f "$MAIN_PUBLISH_MARKER" ]; then
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name previews -exec rm -rf {} +
            : > .nojekyll
          fi

          mkdir -p previews "$STAGING_DIR"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          previews_dir = pathlib.Path(os.environ["PAGES_DIR"]) / "previews"
          previews_dir.mkdir(exist_ok=True)
          desired = {f"pr-{number}" for number in json.loads(os.environ.get("REVIEWABLE_PRS") or "[]")}

          for child in previews_dir.iterdir():
            if child.is_dir() and child.name.startswith("pr-") and child.name not in desired:
              shutil.rmtree(child)
          PY

          for pr in $(python3 - <<'PY'
          import json, os
          for number in json.loads(os.environ.get("REVIEWABLE_PRS") or "[]"):
            print(number)
          PY
          ); do
            SOURCE_DIR="$STAGING_DIR/pr-$pr"
            TARGET_DIR="$PAGES_DIR/previews/pr-$pr"
            rm -rf "$SOURCE_DIR" "$TARGET_DIR"
            mkdir -p "$SOURCE_DIR" "$TARGET_DIR"
            git fetch --depth=1 origin "refs/pull/$pr/head"
            git archive FETCH_HEAD index.html src | tar -x -C "$SOURCE_DIR"
            cp "$SOURCE_DIR/index.html" "$TARGET_DIR/index.html"
            cp -R "$SOURCE_DIR/src" "$TARGET_DIR/src"
            : > "$TARGET_DIR/.nojekyll"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No preview changes to publish."
            exit 0
          fi

          git commit -m "Deploy preview for PR #${{ github.event.pull_request.number }}"
          git push origin gh-pages

      - name: Comment preview URL on pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const marker = "<!-- mopyo-pages-preview -->";
            const body = [
              marker,
              "🔍 Preview URL for this PR:",
              "",
              process.env.PREVIEW_URL,
              "",
              "- 最新のPR headへ自動更新されます。",
              "- このPreviewはレビュー専用で、本番公開ではありません。",
              "- PRを閉じるとPreviewも削除されます。"
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

  cleanup_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Collect reviewable PR numbers
        id: reviewable_prs
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            return JSON.stringify(
              pulls
                .filter(pull => pull.state === "open" && pull.draft === false && pull.head?.repo?.full_name === repository)
                .map(pull => pull.number)
                .sort((a, b) => a - b)
            );

      - name: Reconcile previews after PR close
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_PUBLISH_MARKER: .pages-root-from-main
          REVIEWABLE_PRS: ${{ steps.reviewable_prs.outputs.result }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PAGES_DIR="$RUNNER_TEMP/gh-pages"
          STAGING_DIR="$RUNNER_TEMP/preview-sources"
          export PAGES_DIR REVIEWABLE_PRS STAGING_DIR
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "$PAGES_DIR"
          cd "$PAGES_DIR"

          if ! git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            echo "gh-pages does not exist yet."
            exit 0
          fi

          git checkout gh-pages

          if [ ! -f "$MAIN_PUBLISH_MARKER" ]; then
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name previews -exec rm -rf {} +
            : > .nojekyll
          fi

          mkdir -p previews "$STAGING_DIR"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          previews_dir = pathlib.Path(os.environ["PAGES_DIR"]) / "previews"
          previews_dir.mkdir(exist_ok=True)
          desired = {f"pr-{number}" for number in json.loads(os.environ.get("REVIEWABLE_PRS") or "[]")}

          for child in previews_dir.iterdir():
            if child.is_dir() and child.name.startswith("pr-") and child.name not in desired:
              shutil.rmtree(child)
          PY

          for pr in $(python3 - <<'PY'
          import json, os
          for number in json.loads(os.environ.get("REVIEWABLE_PRS") or "[]"):
            print(number)
          PY
          ); do
            SOURCE_DIR="$STAGING_DIR/pr-$pr"
            TARGET_DIR="$PAGES_DIR/previews/pr-$pr"
            rm -rf "$SOURCE_DIR" "$TARGET_DIR"
            mkdir -p "$SOURCE_DIR" "$TARGET_DIR"
            git fetch --depth=1 origin "refs/pull/$pr/head"
            git archive FETCH_HEAD index.html src | tar -x -C "$SOURCE_DIR"
            cp "$SOURCE_DIR/index.html" "$TARGET_DIR/index.html"
            cp -R "$SOURCE_DIR/src" "$TARGET_DIR/src"
            : > "$TARGET_DIR/.nojekyll"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No preview changes to clean up."
            exit 0
          fi

          git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}"
          git push origin gh-pages

      - name: Update pull request comment after cleanup
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const marker = "<!-- mopyo-pages-preview -->";
            const body = [
              marker,
              "🧹 Preview closed for this PR.",
              "",
              process.env.PREVIEW_URL,
              "",
              "- PRが閉じられたため、レビュー用Previewは削除されました。",
              "- 本番URLには影響しません。"
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

  publish_production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect reviewable PR numbers
        id: reviewable_prs
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            return JSON.stringify(
              pulls
                .filter(pull => pull.state === "open" && pull.draft === false && pull.head?.repo?.full_name === repository)
                .map(pull => pull.number)
                .sort((a, b) => a - b)
            );

      - name: Publish production site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_PUBLISH_MARKER: .pages-root-from-main
          REVIEWABLE_PRS: ${{ steps.reviewable_prs.outputs.result }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PAGES_DIR="$RUNNER_TEMP/gh-pages"
          STAGING_DIR="$RUNNER_TEMP/preview-sources"
          export GITHUB_WORKSPACE MAIN_PUBLISH_MARKER PAGES_DIR REVIEWABLE_PRS STAGING_DIR
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "$PAGES_DIR"
          cd "$PAGES_DIR"

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name previews -exec rm -rf {} +
          cp "$GITHUB_WORKSPACE/index.html" "$PAGES_DIR/index.html"
          cp -R "$GITHUB_WORKSPACE/src" "$PAGES_DIR/src"
          : > "$PAGES_DIR/.nojekyll"
          printf 'published-from-main\n' > "$PAGES_DIR/$MAIN_PUBLISH_MARKER"

          mkdir -p previews "$STAGING_DIR"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          previews_dir = pathlib.Path(os.environ["PAGES_DIR"]) / "previews"
          previews_dir.mkdir(exist_ok=True)
          desired = {f"pr-{number}" for number in json.loads(os.environ.get("REVIEWABLE_PRS") or "[]")}

          for child in previews_dir.iterdir():
            if child.is_dir() and child.name.startswith("pr-") and child.name not in desired:
              shutil.rmtree(child)
          PY

          for pr in $(python3 - <<'PY'
          import json, os
          for number in json.loads(os.environ.get("REVIEWABLE_PRS") or "[]"):
            print(number)
          PY
          ); do
            SOURCE_DIR="$STAGING_DIR/pr-$pr"
            TARGET_DIR="$PAGES_DIR/previews/pr-$pr"
            rm -rf "$SOURCE_DIR" "$TARGET_DIR"
            mkdir -p "$SOURCE_DIR" "$TARGET_DIR"
            git fetch --depth=1 origin "refs/pull/$pr/head"
            git archive FETCH_HEAD index.html src | tar -x -C "$SOURCE_DIR"
            cp "$SOURCE_DIR/index.html" "$TARGET_DIR/index.html"
            cp -R "$SOURCE_DIR/src" "$TARGET_DIR/src"
            : > "$TARGET_DIR/.nojekyll"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No production changes to publish."
            exit 0
          fi

          git commit -m "Deploy production site from main"
          git push origin gh-pages
