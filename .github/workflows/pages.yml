name: Pages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  pull_request_target:
    types:
      - closed
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: gh-pages-writes
  cancel-in-progress: false

jobs:
  prepare_site:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
        github.event.workflow_run.event == 'pull_request'
      )) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      comment_mode: ${{ steps.context.outputs.comment_mode }}
      preview_pr_number: ${{ steps.context.outputs.preview_pr_number }}
      preview_url: ${{ steps.context.outputs.preview_url }}
    steps:
      - name: Checkout trusted Pages workflow files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Collect deployment context
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            const reviewablePullNumbers = pulls
              .filter(pull => pull.state === "open" && pull.draft === false && pull.head?.repo?.full_name === repository)
              .map(pull => pull.number)
              .sort((a, b) => a - b);

            let commentMode = "";
            let previewPrNumber = "";
            let productionSource = "";

            if (context.eventName === "workflow_run") {
              if (context.payload.workflow_run.event === "push" && context.payload.workflow_run.head_branch === context.payload.repository.default_branch) {
                productionSource = context.payload.workflow_run.head_sha;
              }

              if (context.payload.workflow_run.event === "pull_request") {
                const triggerPull = (context.payload.workflow_run.pull_requests || []).find(pull =>
                  pull.head?.repo?.full_name === repository
                );
                if (triggerPull && reviewablePullNumbers.includes(triggerPull.number)) {
                  previewPrNumber = String(triggerPull.number);
                  commentMode = "preview";
                }
              }
            } else if (context.eventName === "pull_request_target") {
              previewPrNumber = String(context.payload.pull_request.number);
              commentMode = "closed";
            }

            core.setOutput("comment_mode", commentMode);
            core.setOutput("preview_pr_number", previewPrNumber);
            core.setOutput("preview_url", previewPrNumber ? `https://${context.repo.owner}.github.io/${context.repo.repo}/previews/pr-${previewPrNumber}/` : "");
            core.setOutput("production_source", productionSource);
            core.setOutput("reviewable_prs", JSON.stringify(reviewablePullNumbers));

      - name: Reconcile Pages site state
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SOURCE: ${{ steps.context.outputs.production_source }}
          REVIEWABLE_PRS: ${{ steps.context.outputs.reviewable_prs }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PAGES_DIR="$RUNNER_TEMP/pages-site"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "$PAGES_DIR"
          cd "$PAGES_DIR"

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

          cd "$GITHUB_WORKSPACE"
          if [ -n "$PRODUCTION_SOURCE" ]; then
            node scripts/reconcile-pages.js --mode production --pages-dir "$PAGES_DIR" --reviewable-prs "$REVIEWABLE_PRS" --production-source "$PRODUCTION_SOURCE"
          else
            node scripts/reconcile-pages.js --mode preview --pages-dir "$PAGES_DIR" --reviewable-prs "$REVIEWABLE_PRS"
          fi

          cd "$PAGES_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --short)" ]; then
            git add -A
            git commit -m "Reconcile Pages site state"
            git push origin gh-pages
          fi

      - name: Remove git metadata from Pages artifact
        run: rm -rf "${{ runner.temp }}/pages-site/.git"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
          include-hidden-files: true

  deploy:
    needs: prepare_site
    if: needs.prepare_site.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  comment_preview:
    needs:
      - prepare_site
      - deploy
    if: needs.prepare_site.outputs.comment_mode != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Update pull request preview comment
        uses: actions/github-script@v7
        env:
          COMMENT_MODE: ${{ needs.prepare_site.outputs.comment_mode }}
          PREVIEW_PR_NUMBER: ${{ needs.prepare_site.outputs.preview_pr_number }}
          PREVIEW_URL: ${{ needs.prepare_site.outputs.preview_url }}
        with:
          script: |
            const marker = "<!-- mopyo-pages-preview -->";
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PREVIEW_PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" &&
              comment.body?.includes(marker)
            );

            const body = process.env.COMMENT_MODE === "closed"
              ? [
                  marker,
                  "🧹 Preview closed for this PR.",
                  "",
                  process.env.PREVIEW_URL,
                  "",
                  "- PRが閉じられたか draft に戻ったため、レビュー用Previewは削除されました。",
                  "- 本番URLには影響しません。"
                ].join("\n")
              : [
                  marker,
                  "🔍 Preview URL for this PR:",
                  "",
                  process.env.PREVIEW_URL,
                  "",
                  "- 最新のPR headへ自動更新されます。",
                  "- このPreviewはレビュー専用で、本番公開ではありません。",
                  "- PRを閉じるか draft に戻すとPreviewも削除されます。"
                ].join("\n");

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
