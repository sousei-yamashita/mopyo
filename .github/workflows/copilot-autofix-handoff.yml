name: Copilot Review Autofix Handoff

on:
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

jobs:
  handoff:
    if: github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
      issues: write
    steps:
      - name: Post @copilot autofix request when review has findings
        uses: actions/github-script@v7
        env:
          MAX_AUTOFIX_ATTEMPTS: "3"
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;
            const review = context.payload.review;
            const headSha = context.payload.pull_request.head.sha;
            const reviewId = review.id;
            const maxAttempts = Number(process.env.MAX_AUTOFIX_ATTEMPTS || "3");

            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100
            });
            const reviewSpecificComments = reviewComments.filter(comment => comment.pull_request_review_id === reviewId);

            const body = review.body || "";
            const hasFindingsText = /changes recommended|unresolved|critical|moderate|fix|指摘|要修正|未解決/i.test(body);
            const shouldRequest = review.state === "changes_requested" || reviewSpecificComments.length > 0 || hasFindingsText;
            if (!shouldRequest) {
              core.info("Copilot review has no actionable findings; no handoff comment posted.");
              return;
            }

            const marker = "<!-- mopyo-copilot-autofix -->";
            const stopMarker = "<!-- mopyo-copilot-autofix-stop -->";
            const dedupeToken = `${marker} review:${reviewId} head:${headSha}`;
            const stopToken = `${stopMarker} head:${headSha}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100
            });

            if (comments.some(comment => (comment.body || "").includes(dedupeToken))) {
              core.info("Duplicate handoff detected for same review/head; skipping.");
              return;
            }

            const attemptCount = comments.filter(comment => (comment.body || "").includes(marker)).length;
            if (attemptCount >= maxAttempts) {
              if (!comments.some(comment => (comment.body || "").includes(stopToken))) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pullNumber,
                  body: [
                    stopToken,
                    "@copilot 自動修正の上限回数に達したため、このPRの自動中継を停止しました。",
                    "- 状態: human review required",
                    "- 対象 head:",
                    `\`${headSha}\``,
                    "- 以降は人間判断での対応をお願いします。"
                  ].join("\n")
                });
              }
              return;
            }

            const commentLines = reviewSpecificComments.length > 0
              ? reviewSpecificComments.map((comment, index) => {
                  const path = comment.path || "(path unavailable)";
                  const line = comment.line ?? comment.original_line ?? "?";
                  const text = (comment.body || "").trim();
                  return `${index + 1}. ${path}:${line}\n   ${text}`;
                })
              : ["(inline review comments were not provided)"];

            const handoffBody = [
              dedupeToken,
              "@copilot Copilot Code Review の指摘対応をお願いします。",
              "",
              "- Trigger: pull_request_review submitted",
              `- Review ID: ${reviewId}`,
              `- Target head SHA: ${headSha}`,
              `- Attempt: ${attemptCount + 1}/${maxAttempts}`,
              "",
              "### Review summary",
              body.trim() || "(empty review body)",
              "",
              "### Review comments",
              ...commentLines,
              "",
              "このコメントに含まれる内容を修正し、必要なら回帰テストを追加してください。"
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullNumber,
              body: handoffBody
            });
